name: Published API contract drift

on:
  schedule:
    - cron: '17 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-drift-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  published-contracts:
    name: Compare published API contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout reviewed SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_ignore_scripts: 'true'
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Audit dependency metadata before installation
        timeout-minutes: 3
        run: pnpm audit --audit-level=moderate
      - name: Install locked tools
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Inspect published source drift
        timeout-minutes: 3
        run: pnpm check:api-drift
      - name: Summarize evidence
        if: always()
        run: |
          if [[ -f coverage/api-contracts/report.md ]]; then
            cat coverage/api-contracts/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' 'API contract inspection did not complete. Inspect the failed setup step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Retain drift evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-contract-evidence
          path: coverage/api-contracts/
          if-no-files-found: error
          retention-days: 30
