  cloud-required-checks:
    name: SDK cloud required checks
    needs: [candidate, cloud-setup, cloud-test, cloud-cleanup]
    if: >-
      always() && github.repository == 'permitio/permit-node' &&
      (github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Checkout checked source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Require setup, every runtime and verified cleanup before proof composition
        env:
          GATE_STAGE: cloud
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-release-gates.mjs
      - name: Setup pinned pnpm without install hooks
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_ignore_scripts: 'true'
        with:
          run_install: false
      - name: Setup Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Install locked proof validators without credentials or lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Download this run's scanned candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .test-results/release-candidate/
      - name: Download all five finite execution cells
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-cloud-*
          path: .test-results/cloud/
      - name: Download independent same-run cleanup receipt
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: node-cloud-cleanup
          path: .test-results/cloud-cleanup/
      - name: Bind each native report to actual cleanup and exact lock bytes
        run: >-
          node scripts/complete-cloud-proof.mjs
          --artifact .test-results/release-candidate/permitio.tgz
          --identity .test-results/release-candidate/identity.json
          --cloud .test-results/cloud --cleanup .test-results/cloud-cleanup/cleanup.json
          --output .test-results/cloud-final
      - name: Save allowlisted cloud observations with verified cleanup
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: node-cloud-final
          path: .test-results/cloud-final/
          if-no-files-found: error

  required-checks:
    name: SDK required checks
    needs: [candidate, test, cleanup]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_ignore_scripts: 'true'
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      - name: Require candidate and backend path checks
        env:
          GATE_STAGE: ci
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-release-gates.mjs
