name: CI

on:
  push:
    branches: [ main ]
  # Run on every PR regardless of base branch so stacked PRs get CI too.
  pull_request:

concurrency:
  # A new push to a PR cancels that PR's superseded run. Pushes to main get a
  # group per commit, so no merge's run is cancelled or replaced while queued.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

env:
  # github actions project id (under 'Permit.io Tests' workspace)
  PROJECT_ID: 7f55831d77c642739bc17733ab0af138
  # The integration and e2e tests run when the environment-provisioning secret
  # is available. Fork PRs and Dependabot PRs get no Actions secrets, so they
  # run only the unit and module-import tests.
  RUN_BACKEND: ${{ secrets.PROJECT_API_KEY != '' }}
  # Pushes and PRs from this repository, other than Dependabot's, must run the
  # backend suite; the test job fails them if the secret is missing.
  BACKEND_REQUIRED: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
  PDP_IMAGE: permitio/pdp-v2:0.9.16@sha256:e3cf30794ec2d256636b4714641df46e51ee58a3f1f0d24c606e214e0bf8669a

jobs:
  lint-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_ignore_scripts: 'true'
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run linting
        run: pnpm lint
      - name: Build project
        run: pnpm build

  test:
    name: test (${{ matrix.node }})
    needs: lint-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Keep node labels in sync with NODE_LABELS in the cleanup job.
        include:
          - node: '22'
            node-version: '22.13.0'
          - node: '24'
            node-version: '24.0.0'
    env:
      # Known before the env is created, so the cleanup job can delete it by
      # key even when this job is cancelled while creating it.
      ENV_KEY: node-sdk-ci-${{ github.run_id }}-${{ github.run_attempt }}-n${{ matrix.node }}
    steps:
      # Fail instead of reporting green on the unit and module-import tests alone.
      - name: Require backend secret on same-repo runs
        if: env.BACKEND_REQUIRED == 'true' && env.RUN_BACKEND != 'true'
        run: |
          echo "::error::PROJECT_API_KEY is not set for a same-repo run, so integration and e2e tests would not run." >&2
          exit 1

      # ---------- Backend setup ----------
      # PROJECT_API_KEY is used only in the next two steps. They run before
      # checkout, so no repository or dependency code runs while it is in use.
      - name: Provision temp Permit env
        id: provision
        if: env.RUN_BACKEND == 'true'
        timeout-minutes: 2
        env:
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
        run: |
          response=$(curl -sS --max-time 30 -w '\n%{http_code}' -X POST \
            "https://api.permit.io/v2/projects/${PROJECT_ID}/envs" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"key\":\"${ENV_KEY}\",\"name\":\"${ENV_KEY}\"}")
          status=${response##*$'\n'}
          body=${response%$'\n'*}
          if [[ "$status" != 2* ]]; then
            echo "::error::Creating env ${ENV_KEY} failed with HTTP ${status}: ${body}" >&2
            exit 1
          fi
          env_id=$(jq -r '.id // empty' <<<"$body")
          if [[ -z "$env_id" ]]; then
            echo "::error::Creating env ${ENV_KEY} returned HTTP ${status} without an id: ${body}" >&2
            exit 1
          fi
          echo "env_id=${env_id}" >> "$GITHUB_OUTPUT"

      # The key goes to a step output, not $GITHUB_ENV, so only the steps that
      # name it get it: the PDP, and the integration and e2e tests.
      - name: Fetch env API key
        id: env_api_key
        if: env.RUN_BACKEND == 'true'
        timeout-minutes: 2
        env:
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
          ENV_ID: ${{ steps.provision.outputs.env_id }}
        run: |
          response=$(curl -sS --max-time 30 --retry 3 -w '\n%{http_code}' \
            "https://api.permit.io/v2/api-key/${PROJECT_ID}/${ENV_ID}" \
            -H "Authorization: Bearer ${PROJECT_API_KEY}")
          status=${response##*$'\n'}
          body=${response%$'\n'*}
          # A successful body holds the key, so it is printed only on HTTP errors.
          if [[ "$status" != 2* ]]; then
            echo "::error::Fetching the API key of env ${ENV_KEY} failed with HTTP ${status}: ${body}" >&2
            exit 1
          fi
          env_api_key=$(jq -r '.secret // empty' <<<"$body")
          if [[ -z "$env_api_key" ]]; then
            echo "::error::The API key response for env ${ENV_KEY} (HTTP ${status}) has no secret field." >&2
            exit 1
          fi
          # Mask BEFORE writing the output so it is redacted everywhere.
          echo "::add-mask::${env_api_key}"
          echo "api_key=${env_api_key}" >> "$GITHUB_OUTPUT"

      # 7766 is the PDP API. 8181 is the PDP's OPA, which the SDK derives from
      # the PDP URL for the rbac spec's useOpa checks.
      - name: Start local PDP
        if: env.RUN_BACKEND == 'true'
        timeout-minutes: 5
        env:
          PDP_API_KEY: ${{ steps.env_api_key.outputs.api_key }}
          PERMIT_API_KEY: ${{ steps.env_api_key.outputs.api_key }}
        run: |
          docker run -d --name pdp \
            -p 127.0.0.1:7766:7000 -p 127.0.0.1:8181:8181 \
            -e PDP_API_KEY -e PERMIT_API_KEY \
            "$PDP_IMAGE"

      # ---------- Both paths ----------
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_ignore_scripts: 'true'
        with:
          run_install: false

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      # --ignore-scripts: this job holds the env API key, so dependency install
      # scripts and the prepare script do not run. The test scripts build.
      - name: Install dependencies
        timeout-minutes: 5
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Builds, then runs the tests that need no backend. No API key is set.
      - name: Run unit and module-import tests
        timeout-minutes: 10
        run: pnpm test

      # ---------- Backend tests ----------
      - name: Wait for PDP to be ready
        if: env.RUN_BACKEND == 'true'
        timeout-minutes: 3
        run: |
          curl -fsS -o /dev/null --max-time 2 \
            --retry 60 --retry-delay 2 --retry-max-time 150 --retry-all-errors \
            http://127.0.0.1:7766/healthy

      - name: Run integration tests
        if: env.RUN_BACKEND == 'true'
        timeout-minutes: 10
        env:
          PDP_API_KEY: ${{ steps.env_api_key.outputs.api_key }}
          PERMIT_API_KEY: ${{ steps.env_api_key.outputs.api_key }}
          # The project-level environment test needs a project-scoped key. It
          # is skipped, with the reason in the report, while this secret is
          # unset, because the env key above is scoped to one environment.
          PROJECT_PDP_API_KEY: ${{ secrets.PROJECT_PDP_API_KEY }}
        run: pnpm test:integration

      - name: Run e2e tests
        if: env.RUN_BACKEND == 'true'
        timeout-minutes: 20
        env:
          PDP_API_KEY: ${{ steps.env_api_key.outputs.api_key }}
          PERMIT_API_KEY: ${{ steps.env_api_key.outputs.api_key }}
          API_TIER: prod
          # Force IPv4: Node resolves `localhost` to ::1 first, but the PDP is
          # published on 127.0.0.1 only, so PDP checks would hit ECONNREFUSED.
          PDP_URL: http://127.0.0.1:7766
          PERMIT_RUN_OPA_E2E: 'true'
        run: pnpm test:e2e

      # Dump PDP diagnostics whenever the backend path fails. The SDK reports
      # PDP connection errors with no HTTP response, so the PDP side is otherwise
      # invisible; this captures container state and logs to tell a transient
      # restart/readiness blip apart from a crashed/exited container.
      - name: Dump PDP diagnostics on failure
        if: failure() && env.RUN_BACKEND == 'true'
        timeout-minutes: 2
        run: |
          echo "::group::docker ps -a"
          docker ps -a --filter name=pdp || true
          echo "::endgroup::"
          echo "::group::PDP container state"
          docker inspect -f \
            'status={{.State.Status}} restartCount={{.RestartCount}} exitCode={{.State.ExitCode}} oomKilled={{.State.OOMKilled}} startedAt={{.State.StartedAt}} finishedAt={{.State.FinishedAt}}' \
            pdp || true
          echo "::endgroup::"
          echo "::group::docker logs pdp"
          docker logs pdp || true
          echo "::endgroup::"
          echo "::group::curl -sv http://127.0.0.1:7766/healthy"
          curl -sv --max-time 5 http://127.0.0.1:7766/healthy || true
          echo "::endgroup::"

  # Runs after every test leg, including failed and cancelled ones, with no
  # checkout, so the project API key never shares a job with repository code.
  cleanup:
    name: Delete temp Permit envs
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # Keep in sync with the test job's node labels.
      NODE_LABELS: 22 24
    steps:
      # A 404 means the env was never created or is already gone. Any other
      # failure is reported as a warning, since the env then needs manual removal.
      - name: Delete temp Permit envs
        if: env.RUN_BACKEND == 'true'
        env:
          PROJECT_API_KEY: ${{ secrets.PROJECT_API_KEY }}
          ENV_KEY_PREFIX: node-sdk-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for node_label in $NODE_LABELS; do
            env_key="${ENV_KEY_PREFIX}-n${node_label}"
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 -X DELETE \
              "https://api.permit.io/v2/projects/${PROJECT_ID}/envs/${env_key}" \
              -H "Authorization: Bearer ${PROJECT_API_KEY}") || status=000
            case "$status" in
              2??) echo "Deleted temp env ${env_key}." ;;
              404) echo "Temp env ${env_key} does not exist; nothing to delete." ;;
              *) echo "::warning::Temp env ${env_key} was not deleted (HTTP ${status}); delete it from project ${PROJECT_ID} manually." ;;
            esac
          done

  codegen-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_ignore_scripts: 'true'
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.13.0'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Java (required by openapi-generator-cli)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test codegen guard failure paths
        run: pnpm test:codegen

      - name: Codegen type-shape guard
        run: pnpm check:codegen
