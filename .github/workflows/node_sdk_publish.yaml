name: Release permit Node SDK

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  candidate:
    permissions:
      contents: read
    # Both forms use the caller's commit; actionlint 1.7.12 does not yet accept `$/`.
    uses: ./.github/workflows/release-candidate.yaml # zizmor: ignore[self-repository]
    with:
      release-tag: ${{ github.event.release.tag_name }}
      prerelease: ${{ github.event.release.prerelease }}

  # Placeholder that blocks publication on purpose. scripts/check-publication-readiness.mjs
  # validates the complete Node release evidence, but this workflow does not yet install its
  # dependencies or download that evidence, so the job states that instead of failing on a
  # missing module. Wiring it means: install, download the evidence, then run the script
  # with --output and GATE_RESULTS.
  publication-acceptance:
    name: Publication acceptance
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Publication acceptance is not wired yet
        run: |
          echo '::error::Publication acceptance is not wired yet: this workflow does not yet provide the Node release evidence that scripts/check-publication-readiness.mjs validates, so npm publication is blocked.' >&2
          exit 1

  publish_node_sdk:
    needs: [candidate, publication-acceptance]
    if: github.repository == 'permitio/permit-node'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Bundles npm 11.x, which Trusted Publishing needs; Node 22.13.0 and 24.0.0 do not.
          # The same exact version as the packed-consumer and cloud matrices.
          node-version: '24.21.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Require all publication dependencies
        env:
          GATE_STAGE: publication
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-release-gates.mjs
      - name: Verify bundled npm supports Trusted Publishing
        run: node scripts/check-publish-runtime.mjs
      - name: Download the exact tested and scanned archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .test-results/release-candidate/
      - name: Recheck archive hash, metadata and source identity
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: >-
          node scripts/release-artifact.mjs --artifact .test-results/release-candidate/permitio.tgz
          --identity .test-results/release-candidate/identity.json --sha256 "$EXPECTED_SHA256"
      # Stable versions get `latest` only when newer than the registry's current latest,
      # otherwise `latest-<major>`; prereleases get their identifier (alpha, beta or rc).
      # See scripts/npm-dist-tag.mjs.
      - name: Choose the npm dist-tag
        id: dist-tag
        timeout-minutes: 2
        env:
          RELEASE_VERSION: ${{ needs.candidate.outputs.version }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/npm-dist-tag.mjs
      - name: Publish package to NPM
        timeout-minutes: 15
        env:
          DIST_TAG: ${{ steps.dist-tag.outputs.tag }}
        run: |
          if [[ -z "$DIST_TAG" ]]; then
            echo '::error::No npm dist-tag was chosen.' >&2
            exit 1
          fi
          npm publish .test-results/release-candidate/permitio.tgz \
            --ignore-scripts --access public --tag "$DIST_TAG"
        # npm OIDC trust remains bound to permitio/permit-node,
        # node_sdk_publish.yaml and production. No NPM_TOKEN is used.
