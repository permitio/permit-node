name: Release permit Node SDK

on:
  release:
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  candidate:
    permissions:
      contents: read
    # Both forms use the caller's commit; actionlint 1.7.12 does not yet accept `$/`.
    uses: ./.github/workflows/release-candidate.yaml # zizmor: ignore[self-repository]
    with:
      release-tag: ${{ github.event.release.tag_name }}
      prerelease: ${{ github.event.release.prerelease }}

  publication-acceptance:
    name: Publication acceptance
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        env:
          npm_config_ignore_scripts: 'true'
        with:
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'
          package-manager-cache: false
      # SDK71 has no releaseReady=true state. Shared adoption and Curtain Call must
      # provide their reviewed acceptance contract before publication can proceed.
      - name: Require the unresolved shared release acceptance
        run: node scripts/check-publication-readiness.mjs

  publish_node_sdk:
    needs: [candidate, publication-acceptance]
    if: github.repository == 'permitio/permit-node'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    env:
      NODE_AUTH_TOKEN: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Require all publication dependencies
        env:
          GATE_STAGE: publication
          GATE_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/check-release-gates.mjs
      - name: Verify bundled npm supports Trusted Publishing
        run: node scripts/check-publish-runtime.mjs
      - name: Download the exact tested and scanned archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: .test-results/release-candidate/
      - name: Recheck archive hash, metadata and source identity
        env:
          EXPECTED_SHA256: ${{ needs.candidate.outputs.sha256 }}
        run: >-
          node scripts/release-artifact.mjs --artifact .test-results/release-candidate/permitio.tgz
          --identity .test-results/release-candidate/identity.json --sha256 "$EXPECTED_SHA256"
      - name: Publish package to NPM
        timeout-minutes: 15
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            npm publish .test-results/release-candidate/permitio.tgz \
              --ignore-scripts --access public --tag rc
          elif [[ "$IS_PRERELEASE" == "false" ]]; then
            npm publish .test-results/release-candidate/permitio.tgz \
              --ignore-scripts --access public
          else
            echo '::error::Release prerelease metadata is invalid.' >&2
            exit 1
          fi
        # npm OIDC trust remains bound to permitio/permit-node,
        # node_sdk_publish.yaml and production. No NPM_TOKEN is used.
