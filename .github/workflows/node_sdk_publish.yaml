name: Release permit Node SDK

on:
  release:
    types: [published]

permissions: {}

# One run per release tag at a time, and a publish is never cancelled part-way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  publish_node_sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write # Required for npm Trusted Publishing (OIDC)
    env:
      # registry-url makes setup-node write an .npmrc that reads
      # ${NODE_AUTH_TOKEN}. setup-node v7 no longer exports a placeholder for it,
      # and yarn 1 stops with "Failed to replace env in config" when the
      # variable is undefined. Publishing gets its token from Trusted Publishing.
      NODE_AUTH_TOKEN: ''
    steps:
      # Safe: this workflow makes only local git commits (docs/version bump); nothing is pushed.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          # This job can publish, so never restore a dependency cache into it.
          package-manager-cache: false

      # Pinned to a major so a new npm major cannot change publishing unannounced.
      # Trusted Publishing needs npm 11.5.1 or later. npm itself has no lockfile
      # to install from, hence the adhoc-packages exception.
      - name: Upgrade npm for Trusted Publishing
        timeout-minutes: 5
        run: npm install -g npm@12 && npm --version # zizmor: ignore[adhoc-packages]

      - name: Set git user
        run: |
          git config --global user.email "eli@permit.io"
          git config --global user.name "elimoshkovich"

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          rm -rf node_modules
          yarn install
          yarn run build
          yarn docs ; git add docs/ ; git commit -m "update tsdoc"

      # Unit and module-import tests only. The integration and e2e suites need a
      # provisioned environment and PDP, and run in the CI workflow's backend job.
      - name: Run tests
        timeout-minutes: 10
        run: yarn test

      - name: Bump version at package.json
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Use the release tag as the version, stripping any leading 'v'
          # (e.g. 'v2.7.6' -> '2.7.6') so it is valid semver for npm.
          VERSION=${RELEASE_TAG#v}
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" package.json
          cat package.json

      - name: Publish package to NPM
        timeout-minutes: 5
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "$PRERELEASE" == "true" ]]; then
            echo "Publishing as a release candidate (rc)..."
            npm publish --access public --tag rc
          else
            echo "Publishing as the latest release..."
            npm publish --access public
          fi
        # No NPM_TOKEN needed — authenticated via npm Trusted Publishing (OIDC),
        # which requires the job's `id-token: write` permission above plus a
        # Trusted Publisher configured on npmjs.com:
        #   permitio/permit-node -> Settings -> Trusted Publishers
        #   (workflow: node_sdk_publish.yaml, environment: production)
        # Provenance attestations are generated automatically.

