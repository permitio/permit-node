version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current. The PDP image in
  # ci.yaml is started with docker run, which Dependabot does not track, so its
  # version and digest are bumped by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    versioning-strategy: increase
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      runtime-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        patterns:
          - '*'
      development-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        patterns:
          - '*'
